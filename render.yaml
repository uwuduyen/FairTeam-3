services:
  - type: web
    name: fairteam-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fairteam-db
          property: connectionString

databases:
  - name: fairteam-db
    plan: 0.1c-256mb
    region: singapore
    databaseName: fairteam
    user: fairteam
    postgresMajorVersion: "18"
    diskSizeGB: 1
